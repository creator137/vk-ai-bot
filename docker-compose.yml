services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      APP_NAME: ${APP_NAME:-VK AI Platform}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://vk_ai:vk_ai@postgres:5432/vk_ai}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      APP_BASE_URL: ${APP_BASE_URL:-}
      INTERNAL_ACCESS_TOKEN: ${INTERNAL_ACCESS_TOKEN:-}
      VK_OUTBOUND_TOKEN: ${VK_OUTBOUND_TOKEN:-}
      VK_API_VERSION: ${VK_API_VERSION:-5.199}
      VK_CALLBACK_SECRET: ${VK_CALLBACK_SECRET:-}
      VK_CALLBACK_CONFIRMATION_TOKEN: ${VK_CALLBACK_CONFIRMATION_TOKEN:-}
      ROBOKASSA_MERCHANT_LOGIN: ${ROBOKASSA_MERCHANT_LOGIN:-}
      ROBOKASSA_PASSWORD1: ${ROBOKASSA_PASSWORD1:-}
      ROBOKASSA_PASSWORD2: ${ROBOKASSA_PASSWORD2:-}
      ROBOKASSA_PASSWORD1_TEST: ${ROBOKASSA_PASSWORD1_TEST:-}
      ROBOKASSA_PASSWORD2_TEST: ${ROBOKASSA_PASSWORD2_TEST:-}
      ROBOKASSA_TEST_MODE: ${ROBOKASSA_TEST_MODE:-false}
      ROBOKASSA_HASH_ALGORITHM: ${ROBOKASSA_HASH_ALGORITHM:-md5}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: dramatiq app.workers.bootstrap
    environment:
      APP_NAME: ${APP_NAME:-VK AI Platform}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://vk_ai:vk_ai@postgres:5432/vk_ai}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-20250514}
      VK_OUTBOUND_TOKEN: ${VK_OUTBOUND_TOKEN:-}
      VK_API_VERSION: ${VK_API_VERSION:-5.199}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vk_ai}
      POSTGRES_USER: ${POSTGRES_USER:-vk_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vk_ai}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vk_ai} -d ${POSTGRES_DB:-vk_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
